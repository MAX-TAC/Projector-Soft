name: Audit KuSettings migration dependencies
on:
  push:
    paths:
      - "tools/audit_kusettings_migration.py"
      - ".github/workflows/audit-kusettings.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install decompilation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq aapt unzip
          curl -fL --retry 3 "https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip" -o /tmp/jadx.zip
          mkdir -p /tmp/jadx
          unzip -q /tmp/jadx.zip -d /tmp/jadx
      - name: Decompile original APKs locally for static inspection
        run: |
          set -euo pipefail
          mkdir -p /tmp/oem-src
          for name in TvSettingsPlus KuSettings KuSourceRJ RuiAutoFocus KeystoneCorrection trdservice trdmiddle RuiYunOta; do
            apk="vendor/reference/8052/APK/$name.apk"
            [ -f "$apk" ] || { echo "Missing APK: $apk"; exit 1; }
            /tmp/jadx/bin/jadx --no-res --no-imports --threads-count 2 -d "/tmp/oem-src/$name" "$apk" \
              > "/tmp/jadx-$name.log" 2>&1 || echo "::warning::JADX partial errors in $name"
          done
      - name: Audit exact activity, service and cross-package references
        run: |
          python3 -u tools/audit_kusettings_migration.py \
             --jadx-dir /tmp/oem-src \
             --apk-dir vendor/reference/8052/APK \
             --out research/oem-apps/KuSettings_Migration
          head -n 80 research/oem-apps/KuSettings_Migration/README.md
      - name: Commit only report (never decompiled OEM sources)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/oem-apps/KuSettings_Migration/
          if ! git diff --cached --quiet; then
            git commit -m "Analyze original 8052 KuSettings IPC and background service dependencies"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kusettings-migration-8052
          path: research/oem-apps/KuSettings_Migration/
          retention-days: 30
