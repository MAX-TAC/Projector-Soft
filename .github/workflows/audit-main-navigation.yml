name: Audit AOSP MainSettings and OEM navigation entry points
on:
  push:
    paths:
      - "tools/audit_main_navigation.py"
      - ".github/workflows/audit-main-navigation.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  nav:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Download jadx
        run: |
          curl -fL --retry 3 https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip -o /tmp/jadx.zip
          mkdir -p /tmp/jadx
          unzip -q /tmp/jadx.zip -d /tmp/jadx
      - name: Decompile and inspect actual OEM/AOSP navigation
        run: |
          /tmp/jadx/bin/jadx --no-res --no-imports --threads-count 2 -d /tmp/nav vendor/reference/8052/APK/TvSettingsPlus.apk >/tmp/jadx.log 2>&1 || true
          python3 tools/audit_main_navigation.py /tmp/nav research/oem-apps/Main_Navigation_8052/metadata.json
      - name: Commit navigation metadata only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/oem-apps/Main_Navigation_8052/
          if ! git diff --cached --quiet; then
            git commit -m "Analyze AOSP main screen integration of OEM projector fragments"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
