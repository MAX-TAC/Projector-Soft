name: Inspect real Android TV multiband EQ implementation
on:
  push:
    paths:
      - tools/audit_equalizer_detail.py
      - .github/workflows/audit-equalizer-detail.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
      - name: Prepare JADX
        run: |
          curl -fsSL --retry 3 https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip -o /tmp/jadx.zip
          mkdir -p /tmp/jadx
          unzip -q /tmp/jadx.zip -d /tmp/jadx
      - name: Inspect equalizer fragment and sound siblings
        run: |
          /tmp/jadx/bin/jadx --no-res --no-imports --threads-count 2 -d /tmp/sound vendor/reference/8052/APK/TvSettingsPlus.apk >/tmp/jadx.log 2>&1 || true
          python3 tools/audit_equalizer_detail.py /tmp/sound research/oem-apps/Native_Controllers_8052/eq_impl.json
      - name: Record EQ capability evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/oem-apps/Native_Controllers_8052/eq_impl.json
          if ! git diff --cached --quiet; then
            git commit -m "Audit native TvSettingsPlus equalizer support and whether multiple bands are controllable"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
