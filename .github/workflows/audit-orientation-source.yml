name: Audit stock projector orientation and source inputs
on:
  push:
    paths:
      - "tools/audit_orientation_source_keys.py"
      - ".github/workflows/audit-orientation-source.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Download decompiler
        run: |
          curl -fsSL --retry 3 https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip -o /tmp/jadx.zip
          mkdir -p /tmp/jadx
          unzip -q /tmp/jadx.zip -d /tmp/jadx
      - name: Inspect OEM projection orientation and source controls
        run: |
          /tmp/jadx/bin/jadx --no-res --no-imports --threads-count 2 -d /tmp/oem vendor/reference/8052/APK/TvSettingsPlus.apk >/tmp/jadx.log 2>&1 || true
          python3 tools/audit_orientation_source_keys.py /tmp/oem research/oem-apps/Native_Controllers_8052/orientation_and_source.json
      - name: Record OEM API metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/oem-apps/Native_Controllers_8052/orientation_and_source.json
          if ! git diff --cached --quiet; then
            git commit -m "Audit real orientation and input source commands before native UI migration"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
