name: Trace five-band DSP EQ value application and support gate
on:
  push:
    paths:
      - tools/audit_eq_dsp_path.py
      - .github/workflows/audit-eq-dsp-path.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Download JADX
        run: |
          curl -fsSL --retry 3 https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip -o /tmp/jadx.zip
          mkdir -p /tmp/jadx
          unzip -q /tmp/jadx.zip -d /tmp/jadx
      - name: Trace OEM five-frequency sound effects
        run: |
          /tmp/jadx/bin/jadx --no-res --no-imports --threads-count 3 -d /tmp/oem vendor/reference/8052/APK/TvSettingsPlus.apk >/tmp/jadx.log 2>&1 || true
          python3 tools/audit_eq_dsp_path.py /tmp/oem research/oem-apps/Native_Controllers_8052/eq_dsp_path.json
      - name: Commit capability metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/oem-apps/Native_Controllers_8052/eq_dsp_path.json
          if ! git diff --cached --quiet; then
            git commit -m "Trace five-band EQ DSP effect and support gating for inline integration"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
