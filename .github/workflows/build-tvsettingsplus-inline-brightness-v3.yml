name: Build experimental TvSettingsPlus v3 inline brightness MOD
on:
  push:
    paths:
      - ".github/workflows/build-tvsettingsplus-inline-brightness-v3.yml"
      - "tools/patch_customer0_lightmode_smali.py"
      - "tools/compose_brightness_v3_apk.py"
      - "app/tvsettingsplus-mod/src/main/java/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare OEM decode and Android SDK tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq apktool aapt apksigner zipalign openssl
          mkdir -p /tmp/tv3 /tmp/tv3/classes /tmp/tv3/dex /tmp/tv3/keys
          test -f "$ANDROID_HOME/platforms/android-33/android.jar"
          test -x "$ANDROID_HOME/build-tools/33.0.3/d8"
          echo 'e4184a13fbf56fa069effc6a40ea50c0da7e9190321b389f59ba34700a80d0a1  vendor/reference/8052/APK/TvSettingsPlus.apk' | sha256sum -c -
      - name: Compile Android 13 OEM-aware right-pane bridge
        run: |
          set -euo pipefail
          ANDROID_JAR="$ANDROID_HOME/platforms/android-33/android.jar"
          javac -source 8 -target 8 -cp "$ANDROID_JAR" -d /tmp/tv3/classes \
            app/tvsettingsplus-mod/src/main/java/dev/projectorsoft/tvsettings/*.java
          find /tmp/tv3/classes -name '*.class' -print0 | xargs -0 "$ANDROID_HOME/build-tools/33.0.3/d8" \
            --lib "$ANDROID_JAR" --min-api 33 --output /tmp/tv3/dex
          test -s /tmp/tv3/dex/classes.dex
          strings /tmp/tv3/dex/classes.dex | grep -q 'LegacyBrightnessUiHook'
      - name: Patch only existing OEM brightness controller and routing
        run: |
          set -euo pipefail
          mkdir -p /tmp/tv3/framework
          apktool if vendor/reference/8052/APK/framework-res.apk -p /tmp/tv3/framework
          apktool d -f -r -p /tmp/tv3/framework vendor/reference/8052/APK/TvSettingsPlus.apk -o /tmp/tv3/decoded
          python3 tools/patch_customer0_lightmode_smali.py /tmp/tv3/decoded /tmp/tv3/patch_report.json
          apktool b -p /tmp/tv3/framework /tmp/tv3/decoded -o /tmp/tv3/rebuilt.apk
          python3 tools/compose_brightness_v3_apk.py \
             vendor/reference/8052/APK/TvSettingsPlus.apk /tmp/tv3/rebuilt.apk \
             /tmp/tv3/dex/classes.dex /tmp/tv3/patch_report.json /tmp/tv3/unsigned.apk
          aapt dump badging /tmp/tv3/unsigned.apk | grep "name='com.android.tv.settings' versionCode='3'"
          aapt dump xmltree /tmp/tv3/unsigned.apk AndroidManifest.xml > /tmp/tv3/manifest-tree.txt
          for action in android.settings.SETTINGS android.settings.WIFI_SETTINGS android.settings.BLUETOOTH_SETTINGS \
             android.settings.AUTO_BLUETOOTH android.settings.PROJECTABOUT_SETTINGS; do
            grep -Fq "$action" /tmp/tv3/manifest-tree.txt
          done
      - name: Cert-verified platform signing and archive integrity
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://raw.githubusercontent.com/aosp-mirror/platform_build/master/target/product/security/platform.x509.pem -o /tmp/tv3/keys/platform.x509.pem
          curl -fsSL --retry 3 https://raw.githubusercontent.com/aosp-mirror/platform_build/master/target/product/security/platform.pk8 -o /tmp/tv3/keys/platform.pk8
          ORIGINAL="$(apksigner verify --print-certs vendor/reference/8052/APK/TvSettingsPlus.apk | grep 'Signer #1 certificate SHA-256 digest:' | head -1 | awk '{print $NF}')"
          PLATFORM="$(openssl x509 -in /tmp/tv3/keys/platform.x509.pem -noout -fingerprint -sha256 | cut -d= -f2 | tr -d : | tr '[:upper:]' '[:lower:]')"
          test "$ORIGINAL" = "$PLATFORM"
          zipalign -f -p 4 /tmp/tv3/unsigned.apk /tmp/tv3/aligned.apk
          apksigner sign --key /tmp/tv3/keys/platform.pk8 --cert /tmp/tv3/keys/platform.x509.pem \
            --v1-signing-enabled true --v2-signing-enabled true --out /tmp/tv3/TvSettingsPlus-8052-v3-INLINE-BRIGHTNESS-EXPERIMENTAL.apk /tmp/tv3/aligned.apk
          apksigner verify --verbose --print-certs /tmp/tv3/TvSettingsPlus-8052-v3-INLINE-BRIGHTNESS-EXPERIMENTAL.apk
          aapt dump badging /tmp/tv3/TvSettingsPlus-8052-v3-INLINE-BRIGHTNESS-EXPERIMENTAL.apk | grep "name='com.android.tv.settings' versionCode='3'"
          sha256sum /tmp/tv3/TvSettingsPlus-8052-v3-INLINE-BRIGHTNESS-EXPERIMENTAL.apk
      - name: Experimental-only metadata
        if: always()
        run: |
          mkdir -p /tmp/tv3/report
          cat > /tmp/tv3/report/README.txt <<'EOF'
          WARNING: EXPERIMENTAL. Not tested on actual projector; DO NOT install as production.
          TvSettingsPlus 8052 platform-signature-matched v3.
          Patches only brightness controller branch and inline OEM adapter,
          preserves focus/keystone calibration classes and OEM resources,
          and retains nine original-compatible settings Intents.
          For customerId=0 with reachable OEM BrightReceiver and readable
          persist.bright.model, switch to in-pane four-option receiver UI.
          Other customers retain original MtkUtil three-option control.
          If receiver/property inaccessible, original fullscreen remains as fallback.
          This is NOT complete KuSettings migration and KuSettings must remain installed.
          EOF
          cp /tmp/tv3/patch_report.json /tmp/tv3/report/patch_report.json 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tvsettingsplus-8052-v3-experimental-inline-brightness
          path: |
            /tmp/tv3/TvSettingsPlus-8052-v3-INLINE-BRIGHTNESS-EXPERIMENTAL.apk
            /tmp/tv3/report/
          retention-days: 14
          if-no-files-found: warn
