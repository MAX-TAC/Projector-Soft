name: Audit real equalizer band limits and persisted settings
on:
  push:
    paths:
      - tools/audit_eq_slider_limits.py
      - .github/workflows/audit-eq-slider-limits.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Prepare JADX
        run: |
          curl -fsSL --retry 3 https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip -o /tmp/jadx.zip
          mkdir -p /tmp/jadx
          unzip -q /tmp/jadx.zip -d /tmp/jadx
      - name: Check DSP sliders in original TvSettingsPlus
        run: |
          /tmp/jadx/bin/jadx --no-res --no-imports --threads-count 2 -d /tmp/oem vendor/reference/8052/APK/TvSettingsPlus.apk >/tmp/jadx.log 2>&1 || true
          python3 tools/audit_eq_slider_limits.py /tmp/oem research/oem-apps/Native_Controllers_8052/eq_slider_limits.json
      - name: Persist EQ scale metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/oem-apps/Native_Controllers_8052/eq_slider_limits.json
          if ! git diff --cached --quiet; then
            git commit -m "Record genuine factory five-band equalizer UI scale and backend"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
