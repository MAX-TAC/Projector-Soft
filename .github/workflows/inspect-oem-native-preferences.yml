name: Inspect native OEM APIs for inline Android TV Preferences
on:
  push:
    paths:
      - "tools/inspect_oem_native_preferences.py"
      - ".github/workflows/inspect-oem-native-preferences.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Prepare JADX
        run: |
          curl -fsSL --retry 3 https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip -o /tmp/jadx.zip
          mkdir -p /tmp/jadx
          unzip -q /tmp/jadx.zip -d /tmp/jadx
      - name: Extract method signatures and controller behavior
        run: |
          /tmp/jadx/bin/jadx --no-res --no-imports --threads-count 2 -d /tmp/native vendor/reference/8052/APK/TvSettingsPlus.apk >/tmp/jadx.log 2>&1 || true
          python3 tools/inspect_oem_native_preferences.py /tmp/native research/oem-apps/Native_Controllers_8052/method_signatures.json
      - name: Commit API facts only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/oem-apps/Native_Controllers_8052/
          if ! git diff --cached --quiet; then
            git commit -m "Record callable native MTK picture, sound and advanced preference methods"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
