name: Inspect exact OTA USB validation and UpdateEngine call flow
on:
  push:
    paths:
      - 'tools/inspect_oem_ota_exact_8054.py'
      - '.github/workflows/inspect-oem-ota-exact-8054.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare JADX
        run: |
          curl -fsSL --retry 3 https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip -o /tmp/jadx.zip
          mkdir -p /tmp/jadx /tmp/ota-source
          unzip -q /tmp/jadx.zip -d /tmp/jadx
      - name: Print exact read-only installer flow for reference OTA APK
        run: |
          /tmp/jadx/bin/jadx --no-res --no-imports --threads-count 2 -d /tmp/ota-source vendor/reference/8052/APK/RuiYunOta.apk >/tmp/jadx-ota.log 2>&1 || true
          python3 tools/inspect_oem_ota_exact_8054.py /tmp/ota-source
