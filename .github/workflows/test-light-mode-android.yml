name: Compile optical brightness right-pane Android code
on:
  push:
    paths:
      - "app/tvsettingsplus-mod/src/main/java/**"
      - "app/tvsettingsplus-mod/src/test/java/**"
      - ".github/workflows/test-light-mode-android.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Resolve Android 13 SDK on GitHub runner
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true
          if [ ! -f "$ANDROID_HOME/platforms/android-33/android.jar" ] || [ ! -x "$ANDROID_HOME/build-tools/33.0.3/d8" ]; then
            SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
            yes | "$SDK_MANAGER" "platforms;android-33" "build-tools;33.0.3" || true
          fi
          test -f "$ANDROID_HOME/platforms/android-33/android.jar"
          test -x "$ANDROID_HOME/build-tools/33.0.3/d8"
      - name: Compile actual Android 13 mode adapter and right-panel widget
        run: |
          set -euo pipefail
          ANDROID_JAR="$ANDROID_HOME/platforms/android-33/android.jar"
          mkdir -p /tmp/mode-classes /tmp/mode-dex
          javac -source 8 -target 8 -cp "$ANDROID_JAR" -d /tmp/mode-classes \
            app/tvsettingsplus-mod/src/main/java/dev/projectorsoft/tvsettings/*.java
          find /tmp/mode-classes -type f -name '*.class' -print0 | \
            xargs -0 "$ANDROID_HOME/build-tools/33.0.3/d8" \
              --lib "$ANDROID_JAR" --min-api 33 --output /tmp/mode-dex
          test -s /tmp/mode-dex/classes.dex
          echo "Android bridge compiled to classes.dex"
      - name: Run pure JVM safety tests
        run: |
          mkdir -p /tmp/jvm-classes
          javac -d /tmp/jvm-classes \
            app/tvsettingsplus-mod/src/main/java/dev/projectorsoft/tvsettings/ProjectorCapabilities.java \
            app/tvsettingsplus-mod/src/main/java/dev/projectorsoft/tvsettings/LightSourceBrightnessController.java \
            app/tvsettingsplus-mod/src/main/java/dev/projectorsoft/tvsettings/MenuPresentationPolicy.java \
            app/tvsettingsplus-mod/src/test/java/dev/projectorsoft/tvsettings/*.java
          for cls in ProjectorCapabilitiesTest LightSourceBrightnessControllerTest MenuPresentationPolicyTest; do
            java -cp /tmp/jvm-classes "dev.projectorsoft.tvsettings.$cls"
          done
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: light-mode-source-module-compiled-only
          path: /tmp/mode-dex/classes.dex
          retention-days: 7
