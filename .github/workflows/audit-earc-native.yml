name: Audit original eARC support and control
on:
  push:
    paths:
      - tools/audit_earc_native_control.py
      - .github/workflows/audit-earc-native.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - name: Install JADX
        run: |
          curl -fsSL --retry 3 https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip -o /tmp/jadx.zip
          mkdir -p /tmp/jadx && unzip -q /tmp/jadx.zip -d /tmp/jadx
      - name: Audit native audio HAL sequence
        run: |
          /tmp/jadx/bin/jadx --no-res --no-imports --threads-count 2 -d /tmp/oem vendor/reference/8052/APK/TvSettingsPlus.apk >/tmp/jadx.log 2>&1 || true
          python3 tools/audit_earc_native_control.py /tmp/oem research/oem-apps/Native_Controllers_8052/earc_native_control.json
      - name: Commit HAL metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/oem-apps/Native_Controllers_8052/earc_native_control.json
          if ! git diff --cached --quiet; then
            git commit -m "Audit exact OEM eARC enable/disable and HDMI CEC dependencies"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
