name: Compare OEM brightness controllers and driver paths
on:
  push:
    paths:
      - "tools/audit_light_mode_overlap.py"
      - ".github/workflows/audit-light-mode-overlap.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare decompiler
        run: |
          curl -fL --retry 3 https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip -o /tmp/jadx.zip
          mkdir -p /tmp/jadx /tmp/src
          unzip -q /tmp/jadx.zip -d /tmp/jadx
      - name: Inspect controller logic in original APKs
        run: |
          for p in KuSourceRJ TvSettingsPlus; do
            /tmp/jadx/bin/jadx --no-res --no-imports --threads-count 2 -d "/tmp/src/$p" "vendor/reference/8052/APK/$p.apk" >/tmp/"$p".log 2>&1 || true
          done
          python3 tools/audit_light_mode_overlap.py /tmp/src research/oem-apps/Brightness_8052/overlap.json
      - name: Save method names and constants, no proprietary Java
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/oem-apps/Brightness_8052/overlap.json
          if ! git diff --cached --quiet; then
            git commit -m "Compare TvSettingsPlus light-mode API to OEM KuSourceRJ receiver"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
