name: Audit exact HDMI EDID and boot source OEM handlers
on:
  push:
    paths:
      - tools/audit_edid_controller.py
      - .github/workflows/audit-edid-controller.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Prepare decompiler
        run: |
          curl -fsSL --retry 3 https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip -o /tmp/jadx.zip
          mkdir -p /tmp/jadx
          unzip -q /tmp/jadx.zip -d /tmp/jadx
      - name: Inspect original input controllers
        run: |
          /tmp/jadx/bin/jadx --no-res --no-imports --threads-count 3 -d /tmp/oem vendor/reference/8052/APK/TvSettingsPlus.apk >/tmp/jadx.log 2>&1 || true
          python3 tools/audit_edid_controller.py /tmp/oem research/oem-apps/Native_Controllers_8052/edid_poweron.json
      - name: Persist metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/oem-apps/Native_Controllers_8052/edid_poweron.json
          if ! git diff --cached --quiet; then
            git commit -m "Record actual EDID and power-on input OEM HAL actions"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
