name: Audit OEM system info and KuSourceRJ watchdog lifecycle
on:
  push:
    paths:
      - tools/audit_system_status_and_source_lifecycle.py
      - .github/workflows/audit-system-and-source-lifecycle.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fetch JADX
        run: |
          curl -fsSL --retry 3 https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip -o /tmp/jadx.zip
          mkdir -p /tmp/jadx && unzip -q /tmp/jadx.zip -d /tmp/jadx
      - name: Decompile OEM service and settings class details
        run: |
          mkdir -p /tmp/audit
          for app in TvSettingsPlus KuSourceRJ KuSettings; do
            /tmp/jadx/bin/jadx --no-res --no-imports --threads-count 2 -d "/tmp/audit/$app" "vendor/reference/8052/APK/$app.apk" > "/tmp/$app.log" 2>&1 || true
          done
          python3 tools/audit_system_status_and_source_lifecycle.py /tmp/audit research/oem-apps/Native_Controllers_8052/lifecycle_telemetry.json
      - name: Record safe OEM metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/oem-apps/Native_Controllers_8052/lifecycle_telemetry.json
          if ! git diff --cached --quiet; then
            git commit -m "Audit firmware thermal and source-service recovery dependencies"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
