name: Audit 8054 source safety
on:
  push:
    branches:
      - audit/8054-tvsettingsplus-20261117
    paths:
      - '.github/workflows/audit-8054-source-safety.yml'
      - 'app/tvsettingsplus-mod/src/main/java/**'
      - 'app/tvsettingsplus-mod/src/test/java/**'
      - 'research/8054/**'
      - 'tools/validate_8054_graph.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate evidence classifications
        run: node tools/validate_8054_graph.js research/8054/dependency_graph_8054.json
      - name: Compile Android bridge against API 33
        run: |
          set -euo pipefail
          ANDROID_JAR="$ANDROID_HOME/platforms/android-33/android.jar"
          if [ ! -f "$ANDROID_JAR" ]; then
            SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
            test -x "$SDK_MANAGER"
            yes | "$SDK_MANAGER" "platforms;android-33" || true
          fi
          test -f "$ANDROID_JAR"
          mkdir -p /tmp/8054-android-classes
          javac -source 8 -target 8 -cp "$ANDROID_JAR" -d /tmp/8054-android-classes \
            app/tvsettingsplus-mod/src/main/java/dev/projectorsoft/tvsettings/*.java
      - name: Test conservative thermal and EDID gates
        run: |
          set -euo pipefail
          mkdir -p /tmp/8054-policy-classes
          javac -d /tmp/8054-policy-classes \
            app/tvsettingsplus-mod/src/main/java/dev/projectorsoft/tvsettings/KuSourceRecoveryActivationPolicy.java \
            app/tvsettingsplus-mod/src/main/java/dev/projectorsoft/tvsettings/KuSourceRecoveryPolicy.java \
            app/tvsettingsplus-mod/src/main/java/dev/projectorsoft/tvsettings/EdidPortPolicy.java \
            app/tvsettingsplus-mod/src/main/java/dev/projectorsoft/tvsettings/ProjectorCompatibilityPolicy.java \
            app/tvsettingsplus-mod/src/test/java/dev/projectorsoft/tvsettings/KuSourceRecoveryActivationPolicyTest.java \
            app/tvsettingsplus-mod/src/test/java/dev/projectorsoft/tvsettings/KuSourceRecoveryPolicyTest.java \
            app/tvsettingsplus-mod/src/test/java/dev/projectorsoft/tvsettings/EdidPortPolicyTest.java \
            app/tvsettingsplus-mod/src/test/java/dev/projectorsoft/tvsettings/ProjectorCompatibilityPolicyTest.java
          for test in KuSourceRecoveryActivationPolicyTest KuSourceRecoveryPolicyTest EdidPortPolicyTest ProjectorCompatibilityPolicyTest; do
            java -cp /tmp/8054-policy-classes "dev.projectorsoft.tvsettings.$test"
          done
      - name: Check Android entry-point wiring remains conservative
        run: |
          set -euo pipefail
          grep -Fq 'automaticRecoveryAllowed(' app/tvsettingsplus-mod/src/main/java/dev/projectorsoft/tvsettings/KuSourceRecoveryBootReceiver.java
          grep -Fq 'mayUseLegacySelector(machineId())' app/tvsettingsplus-mod/src/main/java/dev/projectorsoft/tvsettings/OemHdmiEdidHook.java
          grep -Fq 'return "8052".equals(machineId)' app/tvsettingsplus-mod/src/main/java/dev/projectorsoft/tvsettings/EdidPortPolicy.java
