name: Audit 8054 source safety
on:
  push:
    branches:
      - audit/8054-tvsettingsplus-20261117
    paths:
      - '.github/workflows/audit-8054-source-safety.yml'
      - 'app/tvsettingsplus-mod/src/main/java/**'
      - 'app/tvsettingsplus-mod/src/exact8054/java/**'
      - 'app/tvsettingsplus-mod/ui-tests/**'
      - 'app/tvsettingsplus-mod/src/test/java/**'
      - 'app/tvsettingsplus-mod/src/testFixtures/java/**'
      - 'research/8054/**'
      - 'tools/validate_8054_graph.js'
      - 'tools/generate_8054_release_parity.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Confirm the canonical 96-function release matrix
        run: |
          python3 tools/generate_8054_release_parity.py
          git diff --exit-code -- research/8054/FINAL_FUNCTION_PARITY_8054.csv
      - name: Validate evidence classifications
        run: node tools/validate_8054_graph.js research/8054/dependency_graph_8054.json
      - name: Validate current 96-function delivery inventory
        run: |
          node tools/generate_8054_delivery_status.js research/8054
          git diff --exit-code -- research/8054/delivery_status_8054.json research/8054/DELIVERY_STATUS_8054.md
      - name: Compile Android bridge against API 33
        run: |
          set -euo pipefail
          ANDROID_JAR="$ANDROID_HOME/platforms/android-33/android.jar"
          if [ ! -f "$ANDROID_JAR" ]; then
            SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
            test -x "$SDK_MANAGER"
            yes | "$SDK_MANAGER" "platforms;android-33" || true
          fi
          test -f "$ANDROID_JAR"
          mkdir -p /tmp/8054-android-classes
          javac -source 8 -target 8 -cp "$ANDROID_JAR" -d /tmp/8054-android-classes \
            app/tvsettingsplus-mod/src/main/java/dev/projectorsoft/tvsettings/*.java
      - name: Test conservative thermal and EDID gates
        run: |
          set -euo pipefail
          mkdir -p /tmp/8054-policy-classes
          javac -d /tmp/8054-policy-classes \
            app/tvsettingsplus-mod/src/main/java/dev/projectorsoft/tvsettings/KuSourceRecoveryActivationPolicy.java \
            app/tvsettingsplus-mod/src/main/java/dev/projectorsoft/tvsettings/KuSourceRecoveryPolicy.java \
            app/tvsettingsplus-mod/src/main/java/dev/projectorsoft/tvsettings/EdidPortPolicy.java \
            app/tvsettingsplus-mod/src/main/java/dev/projectorsoft/tvsettings/ProjectorCompatibilityPolicy.java \
            app/tvsettingsplus-mod/src/main/java/dev/projectorsoft/tvsettings/OemBluetoothRemotePolicy.java \
            app/tvsettingsplus-mod/src/test/java/dev/projectorsoft/tvsettings/KuSourceRecoveryActivationPolicyTest.java \
            app/tvsettingsplus-mod/src/test/java/dev/projectorsoft/tvsettings/KuSourceRecoveryPolicyTest.java \
            app/tvsettingsplus-mod/src/test/java/dev/projectorsoft/tvsettings/EdidPortPolicyTest.java \
            app/tvsettingsplus-mod/src/test/java/dev/projectorsoft/tvsettings/ProjectorCompatibilityPolicyTest.java \
            app/tvsettingsplus-mod/src/test/java/dev/projectorsoft/tvsettings/OemBluetoothRemotePolicyTest.java
          for test in KuSourceRecoveryActivationPolicyTest KuSourceRecoveryPolicyTest EdidPortPolicyTest ProjectorCompatibilityPolicyTest OemBluetoothRemotePolicyTest; do
            java -cp /tmp/8054-policy-classes "dev.projectorsoft.tvsettings.$test"
          done
      - name: Test 8054 CEC standby-only operation
        run: |
          mkdir -p /tmp/8054-cec-tests
          javac -d /tmp/8054-cec-tests \
            app/tvsettingsplus-mod/src/main/java/dev/projectorsoft/tvsettings/CecAutoOff8054.java \
            app/tvsettingsplus-mod/src/test/java/dev/projectorsoft/tvsettings/CecAutoOff8054Test.java
          java -cp /tmp/8054-cec-tests dev.projectorsoft.tvsettings.CecAutoOff8054Test
      - name: Test stock Dolby and DTS capability checks
        run: |
          mkdir -p /tmp/audio-effects-tests
          javac -d /tmp/audio-effects-tests \
            app/tvsettingsplus-mod/src/main/java/dev/projectorsoft/tvsettings/AdvancedSound8054Policy.java \
            app/tvsettingsplus-mod/src/test/java/dev/projectorsoft/tvsettings/AdvancedSound8054PolicyTest.java
          java -cp /tmp/audio-effects-tests dev.projectorsoft.tvsettings.AdvancedSound8054PolicyTest
      - name: Test OEM delay units and asynchronous confirmation
        run: |
          mkdir -p /tmp/audio-delay-tests
          javac -d /tmp/audio-delay-tests \
            app/tvsettingsplus-mod/src/main/java/dev/projectorsoft/tvsettings/SoundDelayState.java \
            app/tvsettingsplus-mod/src/test/java/dev/projectorsoft/tvsettings/SoundDelayStateTest.java
          java -cp /tmp/audio-delay-tests dev.projectorsoft.tvsettings.SoundDelayStateTest
      - name: Test picture snapshot and context restrictions
        run: |
          mkdir -p /tmp/picture-state-tests
          javac -d /tmp/picture-state-tests \
            app/tvsettingsplus-mod/src/main/java/dev/projectorsoft/tvsettings/PictureStateTransaction.java \
            app/tvsettingsplus-mod/src/test/java/dev/projectorsoft/tvsettings/OemPictureStateTest.java
          java -cp /tmp/picture-state-tests dev.projectorsoft.tvsettings.OemPictureStateTest
          javac -d /tmp/picture-state-tests \
            app/tvsettingsplus-mod/src/main/java/dev/projectorsoft/tvsettings/PicturePanelState.java \
            app/tvsettingsplus-mod/src/test/java/dev/projectorsoft/tvsettings/PicturePanelStateTest.java
          java -cp /tmp/picture-state-tests dev.projectorsoft.tvsettings.PicturePanelStateTest
          javac -d /tmp/picture-state-tests \
            app/tvsettingsplus-mod/src/main/java/dev/projectorsoft/tvsettings/OemSoundValuePolicy.java \
            app/tvsettingsplus-mod/src/test/java/dev/projectorsoft/tvsettings/OemSoundValuePolicyTest.java
          java -cp /tmp/picture-state-tests dev.projectorsoft.tvsettings.OemSoundValuePolicyTest
          javac -d /tmp/picture-state-tests \
            app/tvsettingsplus-mod/src/main/java/dev/projectorsoft/tvsettings/SoundPanelState.java \
            app/tvsettingsplus-mod/src/test/java/dev/projectorsoft/tvsettings/SoundPanelStateTest.java
          java -cp /tmp/picture-state-tests dev.projectorsoft.tvsettings.SoundPanelStateTest
          javac -d /tmp/picture-state-tests \
            app/tvsettingsplus-mod/src/main/java/dev/projectorsoft/tvsettings/Hdmi8054Policy.java \
            app/tvsettingsplus-mod/src/test/java/dev/projectorsoft/tvsettings/Hdmi8054PolicyTest.java
          java -cp /tmp/picture-state-tests dev.projectorsoft.tvsettings.Hdmi8054PolicyTest
          javac -d /tmp/picture-state-tests \
            app/tvsettingsplus-mod/src/main/java/dev/projectorsoft/tvsettings/HdmiViewLifecycle.java \
            app/tvsettingsplus-mod/src/test/java/dev/projectorsoft/tvsettings/HdmiViewLifecycleTest.java
          java -cp /tmp/picture-state-tests dev.projectorsoft.tvsettings.HdmiViewLifecycleTest
          javac -d /tmp/picture-state-tests \
            app/tvsettingsplus-mod/src/main/java/dev/projectorsoft/tvsettings/MenuInstallation.java \
            app/tvsettingsplus-mod/src/test/java/dev/projectorsoft/tvsettings/MenuInstallationTest.java
          java -cp /tmp/picture-state-tests dev.projectorsoft.tvsettings.MenuInstallationTest
          javac -d /tmp/picture-state-tests \
            app/tvsettingsplus-mod/src/main/java/dev/projectorsoft/tvsettings/Projection8054Policy.java \
            app/tvsettingsplus-mod/src/test/java/dev/projectorsoft/tvsettings/Projection8054PolicyTest.java
          java -cp /tmp/picture-state-tests dev.projectorsoft.tvsettings.Projection8054PolicyTest
          javac -d /tmp/picture-state-tests \
            app/tvsettingsplus-mod/src/main/java/dev/projectorsoft/tvsettings/PictureFormat8054Policy.java \
            app/tvsettingsplus-mod/src/test/java/dev/projectorsoft/tvsettings/PictureFormat8054PolicyTest.java
          java -cp /tmp/picture-state-tests dev.projectorsoft.tvsettings.PictureFormat8054PolicyTest
          javac -d /tmp/picture-state-tests \
            app/tvsettingsplus-mod/src/main/java/dev/projectorsoft/tvsettings/SocInfoLabel.java \
            app/tvsettingsplus-mod/src/test/java/dev/projectorsoft/tvsettings/SocInfoLabelTest.java
          java -cp /tmp/picture-state-tests dev.projectorsoft.tvsettings.SocInfoLabelTest
          javac -d /tmp/picture-state-tests \
            app/tvsettingsplus-mod/src/main/java/dev/projectorsoft/tvsettings/PanelCacheReadout.java \
            app/tvsettingsplus-mod/src/test/java/dev/projectorsoft/tvsettings/PanelCacheReadoutTest.java
          java -cp /tmp/picture-state-tests dev.projectorsoft.tvsettings.PanelCacheReadoutTest
          javac -d /tmp/picture-state-tests \
            app/tvsettingsplus-mod/src/main/java/dev/projectorsoft/tvsettings/ProjectionToggleState.java \
            app/tvsettingsplus-mod/src/test/java/dev/projectorsoft/tvsettings/ProjectionToggleStateTest.java
          java -cp /tmp/picture-state-tests dev.projectorsoft.tvsettings.ProjectionToggleStateTest
          javac -cp /tmp/picture-state-tests -d /tmp/picture-state-tests \
            app/tvsettingsplus-mod/src/main/java/dev/projectorsoft/tvsettings/StandardAndroidNavigationPolicy.java \
            app/tvsettingsplus-mod/src/test/java/dev/projectorsoft/tvsettings/StandardAndroidNavigationPolicyTest.java
          java -cp /tmp/picture-state-tests dev.projectorsoft.tvsettings.StandardAndroidNavigationPolicyTest
      - name: Test production picture and brightness adapters against isolated Android fakes
        run: |
          mkdir -p /tmp/picture-adapter-tests
          javac -d /tmp/picture-adapter-tests \
            $(find app/tvsettingsplus-mod/src/testFixtures/java -name '*.java') \
            app/tvsettingsplus-mod/src/main/java/dev/projectorsoft/tvsettings/PictureStateTransaction.java \
            app/tvsettingsplus-mod/src/main/java/dev/projectorsoft/tvsettings/Projection8054Policy.java \
            app/tvsettingsplus-mod/src/main/java/dev/projectorsoft/tvsettings/ProjectorCapabilities.java \
            app/tvsettingsplus-mod/src/main/java/dev/projectorsoft/tvsettings/LightSourceBrightnessController.java \
            app/tvsettingsplus-mod/src/main/java/dev/projectorsoft/tvsettings/KuSourceRjBrightnessGateway.java \
            app/tvsettingsplus-mod/src/main/java/dev/projectorsoft/tvsettings/OemPictureState.java \
            app/tvsettingsplus-mod/src/main/java/dev/projectorsoft/tvsettings/PicturePanelState.java \
            app/tvsettingsplus-mod/src/main/java/dev/projectorsoft/tvsettings/PanelCacheReadout.java \
            app/tvsettingsplus-mod/src/main/java/dev/projectorsoft/tvsettings/OemPanelInfoHook.java \
            app/tvsettingsplus-mod/src/main/java/dev/projectorsoft/tvsettings/OemProjectionSwitches.java \
            app/tvsettingsplus-mod/src/main/java/dev/projectorsoft/tvsettings/CheckedPreferenceLaunch.java \
            app/tvsettingsplus-mod/src/main/java/dev/projectorsoft/tvsettings/OemHdmiAutoPlayHook.java \
            app/tvsettingsplus-mod/src/main/java/dev/projectorsoft/tvsettings/ProjectionToggleState.java \
            app/tvsettingsplus-mod/src/main/java/dev/projectorsoft/tvsettings/OemPicturePanel.java
          java -cp /tmp/picture-adapter-tests dev.projectorsoft.tvsettings.OemPictureAdapterTest
          java -cp /tmp/picture-adapter-tests dev.projectorsoft.tvsettings.OemPicturePanelAdapterTest
          java -cp /tmp/picture-adapter-tests dev.projectorsoft.tvsettings.Brightness8054AdapterTest
          java -cp /tmp/picture-adapter-tests dev.projectorsoft.tvsettings.MenuIntegrationAdapterTest
      - name: Check Android entry-point wiring remains conservative
        run: |
          set -euo pipefail
          grep -Fq 'automaticRecoveryAllowed(' app/tvsettingsplus-mod/src/main/java/dev/projectorsoft/tvsettings/KuSourceRecoveryBootReceiver.java
          grep -Fq 'mayUseLegacySelector(machineId())' app/tvsettingsplus-mod/src/main/java/dev/projectorsoft/tvsettings/OemHdmiEdidHook.java
          grep -Fq 'return "8052".equals(machineId)' app/tvsettingsplus-mod/src/main/java/dev/projectorsoft/tvsettings/EdidPortPolicy.java
          grep -Fq 'mayOfferLegacyOrientation(machineId())' app/tvsettingsplus-mod/src/main/java/dev/projectorsoft/tvsettings/OemProjectorOrientationHook.java
          grep -Fq 'autoPairSetting(context)' app/tvsettingsplus-mod/src/main/java/dev/projectorsoft/tvsettings/OemBluetoothRemoteHook.java
  host-preflight-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify host preflight with mock ADB
        run: python -m unittest discover -s install-kit -p "test_*.py" -v
      - name: Verify stock timer route detection
        run: python -m unittest discover -s tools -p "test_find_8054_user_routes.py" -v
