name: Audit factory HDMI eARC and surround setting callbacks
on:
  push:
    paths:
      - tools/audit_earc_sound_callbacks.py
      - .github/workflows/audit-actual-earc-callbacks.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: JADX
        run: |
          curl -fsSL --retry 3 https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip -o /tmp/jadx.zip
          mkdir -p /tmp/jadx && unzip -q /tmp/jadx.zip -d /tmp/jadx
      - name: Collect exact OEM sound/CEC state transitions
        run: |
          /tmp/jadx/bin/jadx --no-res --no-imports --threads-count 2 -d /tmp/aud vendor/reference/8052/APK/TvSettingsPlus.apk >/tmp/jadx.log 2>&1 || true
          python3 tools/audit_earc_sound_callbacks.py /tmp/aud research/oem-apps/Native_Controllers_8052/earc_sound_callbacks.json
      - name: Commit safe metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/oem-apps/Native_Controllers_8052/earc_sound_callbacks.json
          if ! git diff --cached --quiet; then
            git commit -m "Map factory eARC surround and auto-volume HAL callbacks"
            git pull --rebase origin main
            git push origin HEAD:main
