name: Audit OEM CEC initialization and power confirmation
on:
  push:
    paths:
      - tools/audit_cec_init_exact.py
      - .github/workflows/audit-cec-init-exact.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - name: Prepare JADX
        run: |
          curl -fsSL --retry 3 https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip -o /tmp/jadx.zip
          mkdir -p /tmp/jadx
          unzip -q /tmp/jadx.zip -d /tmp/jadx
      - name: Inspect original CEC source controller
        run: |
          /tmp/jadx/bin/jadx --no-res --no-imports --threads-count 2 -d /tmp/oem vendor/reference/8052/APK/TvSettingsPlus.apk >/tmp/jadx.log 2>&1 || true
          python3 tools/audit_cec_init_exact.py /tmp/oem research/oem-apps/Native_Controllers_8052/cec_initialization.json
      - name: Commit only CEC metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/oem-apps/Native_Controllers_8052/cec_initialization.json
          if ! git diff --cached --quiet; then
            git commit -m "Trace CEC backend and power-confirmation safety conditions"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
