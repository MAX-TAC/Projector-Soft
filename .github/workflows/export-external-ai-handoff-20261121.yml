name: Export independent AI firmware and MOD handoff (documentation only)
on:
  push:
    branches:
      - docs/external-ai-complete-handoff-20261121
    paths:
      - 'research/EXTERNAL_AI_HANDOFF_20261121/**'
      - '.github/workflows/export-external-ai-handoff-20261121.yml'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Bundle source-pinned firmware research, exact 8054 reports and MOD v41 sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/external-ai-bundle/{00_HANDOFF,01_PROJECTOR_SOFT,02_EVERYCOM_FIRMWARE,03_EVERYCOM_AVB_EXTRA,04_FLIXTONE_BACKUP,05_EXACT_8054_NATIVE_PR3}
          cp -a research/EXTERNAL_AI_HANDOFF_20261121/. /tmp/external-ai-bundle/00_HANDOFF/
          mkdir -p /tmp/external-ai-bundle/01_PROJECTOR_SOFT/{docs,research,app-src,tools}
          cp -a docs/. /tmp/external-ai-bundle/01_PROJECTOR_SOFT/docs/
          cp -a research/8054/. /tmp/external-ai-bundle/01_PROJECTOR_SOFT/research/
          cp -a app/tvsettingsplus-mod/src/. /tmp/external-ai-bundle/01_PROJECTOR_SOFT/app-src/
          cp -a tools/. /tmp/external-ai-bundle/01_PROJECTOR_SOFT/tools/
          cp README.md /tmp/external-ai-bundle/01_PROJECTOR_SOFT/PROJECT_README.md

          clone_pinned() {
            local url="$1" branch="$2" sha="$3" dest="$4"
            git clone -q --depth 1 --filter=blob:none --sparse --branch "$branch" "$url" "$dest"
            local actual
            actual="$(git -C "$dest" rev-parse HEAD)"
            echo "SOURCE $url branch=$branch HEAD=$actual expected=$sha"
            test "$actual" = "$sha"
          }

          clone_pinned https://github.com/MAX-TAC/Everycom-Cinelux-Firmware.git \
            custom-v0-branding-debloat-ota-design-20261021 \
            4f936565b3b81e34d05beb0defbdd98481a32456 /tmp/firmware-base
          git -C /tmp/firmware-base sparse-checkout set analysis custom-v0 ota tools README.md
          cp -a /tmp/firmware-base/{analysis,custom-v0,tools} /tmp/external-ai-bundle/02_EVERYCOM_FIRMWARE/
          if test -d /tmp/firmware-base/ota; then cp -a /tmp/firmware-base/ota /tmp/external-ai-bundle/02_EVERYCOM_FIRMWARE/; fi

          clone_pinned https://github.com/MAX-TAC/Everycom-Cinelux-Firmware.git \
            research-ota8052-avb-key-match-20261021 \
            f89993bde272821d985ea6312601c7409634e13d /tmp/firmware-avb
          git -C /tmp/firmware-avb sparse-checkout set analysis/8052_Live_ADB_20261021 analysis/AVB_Chain_RE_8052 analysis/AVB_Key_Research_20261021
          cp -a /tmp/firmware-avb/analysis/. /tmp/external-ai-bundle/03_EVERYCOM_AVB_EXTRA/

          clone_pinned https://github.com/MAX-TAC/FlixTone_8054_Backup.git \
            main a0f63c7e49515766be432c3cfe2e360b21717bbb /tmp/flixback
          git -C /tmp/flixback sparse-checkout set tools .github/workflows
          cp -a /tmp/flixback/tools /tmp/external-ai-bundle/04_FLIXTONE_BACKUP/
          cp -a /tmp/flixback/.github /tmp/external-ai-bundle/04_FLIXTONE_BACKUP/

          clone_pinned https://github.com/MAX-TAC/Projector-Soft.git \
            research/8054-mediatek-native-api-20261120 \
            d1854db0539c522f81f3c2ee355d08338197ae8a /tmp/project-native
          git -C /tmp/project-native sparse-checkout set research/8054/native
          cp -a /tmp/project-native/research/8054/native/. /tmp/external-ai-bundle/05_EXACT_8054_NATIVE_PR3/

          cat > /tmp/external-ai-bundle/README_FIRST.txt <<'EOF'
          Independent AI handoff for 8052/8053/8054 projectors and TvSettingsPlus MOD v41.
          Start with 00_HANDOFF/README.md then 07_INDEPENDENT_AI_REVIEW_TASK.md.
          This is a DOCUMENTATION AND SOURCE archive, NOT a flashable ROM, APK or OTA.
          The release images (multi-GB) remain at the GitHub links with published SHA256.
          01_PROJECTOR_SOFT contains original v41/PR5 sources & reports, NOT a hardware-qualified build.
          Original firmware research is from commit-pinned historical branches (verified at export).
          No projector or ADB device was accessed to create this archive.
          EOF

          (
            cd /tmp
            zip -qr -9 EXTERNAL_AI_HANDOFF_20261121.zip external-ai-bundle
          )
          test -s /tmp/EXTERNAL_AI_HANDOFF_20261121.zip
          unzip -tq /tmp/EXTERNAL_AI_HANDOFF_20261121.zip | tail -n 1
          sha256sum /tmp/EXTERNAL_AI_HANDOFF_20261121.zip | tee /tmp/EXTERNAL_AI_HANDOFF_20261121.zip.sha256
          du -h /tmp/EXTERNAL_AI_HANDOFF_20261121.zip

      - uses: actions/upload-artifact@v4
        with:
          name: EXTERNAL-AI-HANDOFF-8052-8053-8054-MOD-v41
          path: |
            /tmp/EXTERNAL_AI_HANDOFF_20261121.zip
            /tmp/EXTERNAL_AI_HANDOFF_20261121.zip.sha256
          if-no-files-found: error
          retention-days: 90
