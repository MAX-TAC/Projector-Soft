name: Audit projector light brightness modes
on:
  push:
    paths:
      - "tools/audit_light_source_brightness.py"
      - ".github/workflows/audit-light-source.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Download JADX
        run: |
          curl -fL https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip -o /tmp/jadx.zip
          mkdir -p /tmp/jadx
          unzip -q /tmp/jadx.zip -d /tmp/jadx
      - name: Inspect KuSourceRJ and TvSettingsPlus
        run: |
          mkdir -p /tmp/extracted
          for item in KuSourceRJ TvSettingsPlus; do
            /tmp/jadx/bin/jadx --no-res --no-imports --threads-count 2 -d /tmp/extracted/$item vendor/reference/8052/APK/$item.apk > /tmp/jadx-$item.log 2>&1 || true
          done
          python3 tools/audit_light_source_brightness.py /tmp/extracted research/oem-apps/Brightness_8052/oem_methods.json
      - name: Store report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/oem-apps/Brightness_8052/
          if ! git diff --cached --quiet; then
            git commit -m "Audit OEM light source modes and TV settings integration"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
