name: Build ProjectorProbe (audio/EQ diagnostic)
on:
  workflow_dispatch:
  push:
    paths:
      - 'probe/**'
      - '.github/workflows/build-projector-probe.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK build-tools
        run: |
          set -euo pipefail
          mkdir -p /tmp/pb/classes /tmp/pb/dex /tmp/pb/apk
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          yes | "$SDK_MANAGER" "platforms;android-33" "build-tools;33.0.3" >/dev/null 2>&1 || true
          # Значения пишем РАСКРЫТЫМИ (без $VAR внутри GITHUB_ENV)
          AJ="$ANDROID_HOME/platforms/android-33/android.jar"
          BT="$ANDROID_HOME/build-tools/33.0.3"
          test -f "$AJ" || { echo "android.jar missing"; exit 1; }
          test -x "$BT/d8" || { echo "d8 missing"; exit 1; }
          echo "ANDROID_JAR=$AJ" >> "$GITHUB_ENV"
          echo "BT=$BT" >> "$GITHUB_ENV"
          echo "AJ=$AJ  BT=$BT"

      - name: Compile Java
        run: |
          set -euo pipefail
          echo "ANDROID_JAR=$ANDROID_JAR"
          echo "BT=$BT"
          ls -la "$ANDROID_JAR"
          javac -source 8 -target 8 -nowarn -cp "$ANDROID_JAR" -d /tmp/pb/classes \
            probe/src/dev/projectorsoft/probe/*.java 2>&1 | tee /tmp/pb/javac.log
          test "${PIPESTATUS[0]}" -eq 0
          find /tmp/pb/classes -name '*.class' | head

      - name: Convert to DEX
        run: |
          set -euo pipefail
          find /tmp/pb/classes -name '*.class' -print0 | xargs -0 "$BT/d8" \
            --lib "$ANDROID_JAR" --min-api 33 --output /tmp/pb/dex 2>&1 | tee /tmp/pb/d8.log
          test -s /tmp/pb/dex/classes.dex
          ls -la /tmp/pb/dex/
          strings /tmp/pb/dex/classes.dex | grep -q 'setPreferredDevicesForStrategy'
          strings /tmp/pb/dex/classes.dex | grep -q 'audiofx/Equalizer'
          echo "DEX OK"

      - name: Package and sign APK
        run: |
          set -euo pipefail
          cd /tmp/pb
          cp "$GITHUB_WORKSPACE/probe/AndroidManifest.xml" .
          mkdir -p emptypayload
          # aapt2 (есть в build-tools 33) — надёжнее для бинарного манифеста
          "$BT/aapt2" link --manifest AndroidManifest.xml -I "$ANDROID_JAR" \
            --min-sdk-version 33 --target-sdk-version 33 \
            --version-code 1 --version-name 1.0 -o base.apk 2>&1 | tee aapt2.log || true
          if [ ! -s base.apk ]; then
            echo "aapt2 failed, fallback to aapt"
            "$BT/aapt" package -f -M AndroidManifest.xml -I "$ANDROID_JAR" -F base.apk emptypayload
          fi
          test -s base.apk
          mkdir -p work
          cd work
          unzip -o ../base.apk >/dev/null
          cp /tmp/pb/dex/classes.dex .
          zip -q -X -r ../packed.apk .
          # resources.arsc должен быть НЕсжатым и выровненным (Android 11+)
          zip -q -X -0 ../packed.apk resources.arsc
          cd ..
          "$BT/zipalign" -f -p 4 packed.apk aligned.apk
          keytool -genkeypair -keystore ks.jks -storepass android -keypass android \
            -alias probe -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=ProjectorProbe,O=DSH,C=RU" >/dev/null 2>&1
          java -jar "$BT/lib/apksigner.jar" sign --ks ks.jks \
            --ks-pass pass:android --key-pass pass:android \
            --out ProjectorProbe.apk aligned.apk
          unzip -v ProjectorProbe.apk | grep resources.arsc`n          java -jar "$BT/lib/apksigner.jar" verify --print-certs ProjectorProbe.apk
          "$BT/aapt" dump badging ProjectorProbe.apk | head -3
          ls -la ProjectorProbe.apk

      - name: Collect build logs
        if: always()
        run: |
          mkdir -p /tmp/pb/logs
          cp /tmp/pb/*.log /tmp/pb/logs/ 2>/dev/null || true
          ls -la /tmp/pb/ > /tmp/pb/logs/dir.txt 2>&1 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ProjectorProbe-buildlogs
          path: /tmp/pb/logs/
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ProjectorProbe
          path: /tmp/pb/ProjectorProbe.apk
          if-no-files-found: error
