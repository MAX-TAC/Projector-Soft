name: Build ProjectorProbe (audio/EQ diagnostic)
on:
  workflow_dispatch:
  push:
    paths:
      - 'probe/**'
      - '.github/workflows/build-projector-probe.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK build-tools
        run: |
          set -euo pipefail
          mkdir -p /tmp/pb/classes /tmp/pb/dex /tmp/pb/apk
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          yes | "$SDK_MANAGER" "platforms;android-33" "build-tools;33.0.3" >/dev/null 2>&1 || true
          test -f "$ANDROID_HOME/platforms/android-33/android.jar"
          test -x "$ANDROID_HOME/build-tools/33.0.3/d8"
          echo "ANDROID_JAR=$ANDROID_HOME/platforms/android-33/android.jar" >> "$GITHUB_ENV"
          echo "BT=$ANDROID_HOME/build-tools/33.0.3" >> "$GITHUB_ENV"

      - name: Compile Java
        run: |
          set -euo pipefail
          javac -source 8 -target 8 -nowarn -cp "$ANDROID_JAR" -d /tmp/pb/classes \
            probe/src/dev/projectorsoft/probe/*.java
          echo "javac OK"
          ls -R /tmp/pb/classes | head -20

      - name: Convert to DEX
        run: |
          set -euo pipefail
          find /tmp/pb/classes -name '*.class' -print0 | xargs -0 "$BT/d8" \
            --lib "$ANDROID_JAR" --min-api 33 --output /tmp/pb/dex
          test -s /tmp/pb/dex/classes.dex
          ls -la /tmp/pb/dex/
          strings /tmp/pb/dex/classes.dex | grep -q 'setPreferredDevicesForStrategy'
          strings /tmp/pb/dex/classes.dex | grep -q 'audiofx/Equalizer'
          echo "DEX OK"

      - name: Package and sign APK
        run: |
          set -euo pipefail
          cd /tmp/pb
          cp "$GITHUB_WORKSPACE/probe/AndroidManifest.xml" .
          mkdir -p emptypayload
          # aapt package с пустой папкой ресурсов -> корректный бинарный манифест
          "$BT/aapt" package -f \
            -M AndroidManifest.xml \
            -I "$ANDROID_JAR" \
            -F base.apk \
            emptypayload
          test -s base.apk
          # Проверяем, что манифест бинарный и читается
          unzip -l base.apk
          # Вливаем classes.dex внутрь zip
          cd /tmp/pb
          cp base.apk src.apk
          mkdir -p work
          cd work
          unzip -o ../src.apk >/dev/null
          cp /tmp/pb/dex/classes.dex .
          zip -q -X -r ../packed.apk .
          cd ..
          ls -la packed.apk
          "$BT/zipalign" -f -p 4 packed.apk aligned.apk
          keytool -genkeypair -keystore ks.jks -storepass android -keypass android \
            -alias probe -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=ProjectorProbe,O=DSH,C=RU" >/dev/null 2>&1
          java -jar "$BT/lib/apksigner.jar" sign --ks ks.jks \
            --ks-pass pass:android --key-pass pass:android \
            --out ProjectorProbe.apk aligned.apk
          java -jar "$BT/lib/apksigner.jar" verify --print-certs ProjectorProbe.apk
          "$BT/aapt" dump badging ProjectorProbe.apk | head -5
          ls -la ProjectorProbe.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ProjectorProbe
          path: /tmp/pb/ProjectorProbe.apk
          if-no-files-found: error
