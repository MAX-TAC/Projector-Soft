name: Audit stock HDMI EDID CEC EQ implementation
on:
  push:
    paths:
      - tools/audit_hdmi_eq_api.py
      - .github/workflows/audit-hdmi-eq.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
      - name: Prepare JADX
        run: |
          curl -fsSL --retry 3 https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip -o /tmp/jadx.zip
          mkdir -p /tmp/jadx
          unzip -q /tmp/jadx.zip -d /tmp/jadx
      - name: Decompile exact OEM sound and HDMI applications
        run: |
          mkdir -p /tmp/oem
          for app in TvSettingsPlus KuSettings KuSourceRJ; do
            /tmp/jadx/bin/jadx --no-res --no-imports --threads-count 3 -d "/tmp/oem/$app" "vendor/reference/8052/APK/$app.apk" >/tmp/"$app".log 2>&1 || true
          done
          python3 tools/audit_hdmi_eq_api.py /tmp/oem research/oem-apps/Native_Controllers_8052/hdmi_eq_audit.json
      - name: Commit only OEM metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/oem-apps/Native_Controllers_8052/hdmi_eq_audit.json
          if ! git diff --cached --quiet; then
            git commit -m "Verify OEM HDMI CEC EDID commands and check DSP EQ class presence"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
